name: Request a feature
description: Suggest an improvement to TranscriptTamer.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Requests are public and require a GitHub account. Do not include private transcript content."
  - type: textarea
    id: request
    attributes:
      label: What would you like to do?
      description: Describe the workflow and how this change would help.
    validations:
      required: true
